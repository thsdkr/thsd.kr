<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thsd&#46;kr</title>
    <meta name="author" content="Jimin Cheon">
    <meta property="og:title" content="thsd.kr">
    <meta property="og:description" content="thsd.kr is coming soon. But try the preview menu">
    <meta property="og:type" content="article">
    <meta property="og:image" content="image/og-img-cs.png">
    <link rel="icon" href="image/favicon.png" />
    <link rel="apple-touch-icon" href="image/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
    <meta http-equiv="refresh" content="2; url=https://thsd.framer.website">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            overflow: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 52px;
            padding: 0 20px;
        }

        .image {
            width: 480px;
            max-width: 80vw;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
        }

        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #383838;
            border-radius: 50%;
            animation: dotPulse 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        .dot:nth-child(3) {
            animation-delay: 0s;
        }

        @keyframes dotPulse {

            0%,
            80%,
            100% {
                transform: scale(0.35);
                opacity: 0.25;
            }

            40% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        h1 {
            font-family: "Krona One", sans-serif;
            font-style: normal;
            font-size: 13px;
            letter-spacing: -0.7px;
            color: #383838;
            text-align: center;
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
        }

        @media (max-width: 600px) {
            .container {
                gap: 40px;
            }

            .image {
                width: 75vw;
                max-width: 320px;
            }

            .loader {
                gap: 10px;
            }

            .dot {
                width: 10px;
                height: 10px;
            }

            h1 {
                font-size: 11px;
                letter-spacing: -0.5px;
                bottom: 20px;
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img class="image" src="image/thsd.kr-logo.svg" alt="thsd.kr logo">
        <div class="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    <h1>&#169; 2026 thsd&#46; All Rights Reserved&#46;</h1>
</body>

</html>
