<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thsdCLOUD</title>
    <meta name="author" content="Jimin Cheon">
    <meta property="og:title" content="thsdCLOUD">
    <meta property="og:description" content="This website is a private server of thsd">
    <meta property="og:type" content="article">
    <meta property="og:image" content="/cloud/image/og-img.png">
    <link rel="icon" href="/cloud/image/favicon.png" />
    <link rel="apple-touch-icon" href="/cloud/image/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
    <meta http-equiv="refresh" content="2; url=http://cloud.thsd.kr">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            overflow: hidden;
        }

        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .dot {
            width: 14px;
            height: 14px;
            background-color: #080808;
            border-radius: 50%;
            animation: dotPulse 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        .dot:nth-child(3) {
            animation-delay: 0s;
        }

        @keyframes dotPulse {

            0%,
            80%,
            100% {
                transform: scale(0.4);
                opacity: 0.3;
            }

            40% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        h1 {
            font-family: "Krona One", sans-serif;
            font-style: normal;
            font-size: 23px;
            letter-spacing: -0.7px;
            color: #080808;
            text-align: center;
            position: fixed;
            top: 94%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 16px;
                top: 94%;
            }
        }
    </style>
</head>

<body>
    <div class="loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <h1>&#169; 2026 thsd&#46; All Rights Reserved&#46;</h1>
</body>

</html>
